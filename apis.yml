description: 'REDEF is a media curation and newsletter company founded and led by Jason
  Hirschhorn (CEO + Chief Curator) that "DJs the internet" — surfacing daily remixes
  of the stories, people, and ideas that matter across Media, Fashion, Music, Sports,
  and Tech. Readers follow curated Mixes, Sets, Originals, Charts, and email Newsletters
  ("interest remixes for curious minds"), and can build and share their own mixes.
  ReDEF was surfaced as a portfolio company of bloomberg-beta and added to the API
  Evangelist network; enrichment found a public consumer content website (redef.com)
  but no public developer program, API, documentation, or machine-readable surface.'
